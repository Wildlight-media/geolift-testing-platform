services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: geolift
      POSTGRES_PASSWORD: geolift
      POSTGRES_DB: geolift
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geolift"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  r-service:
    build: ./r-service
    ports:
      - "8001:8001"
    environment:
      PORT: 8001
    healthcheck:
      # rocker/r-ver has neither curl nor wget by default; bash's built-in
      # /dev/tcp avoids depending on an external binary at all.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8001 && printf 'GET /health HTTP/1.0\\r\\n\\r\\n' >&3 && head -c 12 <&3 | grep -q 200"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://geolift:geolift@postgres:5432/geolift
      REDIS_URL: redis://redis:6379/0
      R_SERVICE_URL: http://r-service:8001
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      CORS_ORIGINS: '["${FRONTEND_URL:-http://localhost:3000}"]'
      STORAGE_DIR: /srv/backend/storage
    volumes:
      - backend_storage:/srv/backend/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  worker:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://geolift:geolift@postgres:5432/geolift
      REDIS_URL: redis://redis:6379/0
      R_SERVICE_URL: http://r-service:8001
      STORAGE_DIR: /srv/backend/storage
    volumes:
      - backend_storage:/srv/backend/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["python", "-m", "app.workers.worker_main"]

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  backend_storage:
